name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  supabase:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy submit-report --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy verify-cleanup --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

  clip-space:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Push only clip-service/ to the Space; it is its own repo root there.
      # The Space is a ZeroGPU Gradio Space - see clip-service/README.md.
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}   # e.g. username/litter-ally-clip
        run: |
          cd clip-service
          git init -q
          git config user.email "ci@github"
          git config user.name "CI"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -qf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
